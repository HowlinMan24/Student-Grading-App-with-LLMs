<header *ngIf="visible" class="fixed top-0 w-full z-50 border-b border-zinc-800/60 bg-zinc-950/90 backdrop-blur-xl">
  <nav class="flex items-center justify-between max-w-7xl mx-auto px-6 h-16">

    <a routerLink="/" class="flex items-center gap-2.5 group">
      <div class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center flex-shrink-0 group-hover:bg-indigo-400 transition-colors">
        <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3z"/>
          <path d="M3.31 9.397L5 10.12v4.102a8.969 8.969 0 00-1.05-.174 1 1 0 01-.89-.89 11.115 11.115 0 01.25-3.762zM9.3 16.573A9.026 9.026 0 007 14.935v-3.957l1.818.78a3 3 0 002.364 0l5.508-2.361a11.026 11.026 0 01.25 3.762 1 1 0 01-.89.89 8.968 8.968 0 00-5.35 2.524 1 1 0 01-1.4 0z"/>
        </svg>
      </div>
      <span class="text-zinc-100 font-semibold text-lg tracking-tight">EduEval</span>
    </a>

    <div class="flex items-center gap-1">
      <ng-container *ngIf="authService.isLoggedIn$ | async; else notLoggedIn">
        <span class="text-zinc-500 text-sm mr-3 hidden sm:inline">
          Welcome, <span class="text-zinc-200 font-medium">{{ userName }}</span>
        </span>
        <a routerLink="/chat"
           class="text-zinc-400 hover:text-zinc-100 text-sm font-medium px-3 py-2 rounded-lg hover:bg-zinc-800/80 transition-all duration-200">
          Chat
        </a>
        <button (click)="logout()"
                class="text-zinc-400 hover:text-zinc-100 text-sm font-medium px-3 py-2 rounded-lg hover:bg-zinc-800/80 transition-all duration-200">
          Sign out
        </button>
      </ng-container>
      <ng-template #notLoggedIn>
        <a routerLink="/register"
           class="text-zinc-400 hover:text-zinc-100 text-sm font-medium px-3 py-2 rounded-lg hover:bg-zinc-800/80 transition-all duration-200">
          Register
        </a>
        <a routerLink="/login"
           class="text-zinc-400 hover:text-zinc-100 text-sm font-medium px-3 py-2 rounded-lg hover:bg-zinc-800/80 transition-all duration-200">
          Sign in
        </a>
        <a routerLink="/register"
           class="bg-indigo-500 hover:bg-indigo-400 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-all duration-200 ml-1">
          Get started
        </a>
      </ng-template>
    </div>
  </nav>
</header>
