<div class="min-h-screen bg-zinc-950 flex items-center justify-center px-4 pt-16 pb-10">
  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="flex items-center gap-2.5 justify-center mb-10">
      <div class="w-9 h-9 rounded-xl bg-indigo-500 flex items-center justify-center">
        <svg class="w-4.5 h-4.5 text-white" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3z"/>
          <path d="M3.31 9.397L5 10.12v4.102a8.969 8.969 0 00-1.05-.174 1 1 0 01-.89-.89 11.115 11.115 0 01.25-3.762zM9.3 16.573A9.026 9.026 0 007 14.935v-3.957l1.818.78a3 3 0 002.364 0l5.508-2.361a11.026 11.026 0 01.25 3.762 1 1 0 01-.89.89 8.968 8.968 0 00-5.35 2.524 1 1 0 01-1.4 0z"/>
        </svg>
      </div>
      <span class="text-zinc-100 font-bold text-xl">EduEval</span>
    </div>

    <!-- Card -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-8">
      <h1 class="text-zinc-100 text-2xl font-bold mb-1">Create an account</h1>
      <p class="text-zinc-500 text-sm mb-8">Get started with free AI-powered feedback</p>

      <form #registerForm="ngForm" (ngSubmit)="register(registerForm)" class="space-y-4">
        <div>
          <label class="text-zinc-400 text-xs font-semibold uppercase tracking-wider block mb-2">Full name</label>
          <input
            name="name"
            [(ngModel)]="user.name"
            placeholder="Your name"
            required
            autocomplete="name"
            class="w-full bg-zinc-800 border border-zinc-700 hover:border-zinc-600 focus:border-indigo-500/60 focus:outline-none text-zinc-100 placeholder-zinc-600 rounded-xl px-4 py-3 text-sm transition-colors">
        </div>
        <div>
          <label class="text-zinc-400 text-xs font-semibold uppercase tracking-wider block mb-2">Email</label>
          <input
            name="email"
            [(ngModel)]="user.email"
            type="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
            class="w-full bg-zinc-800 border border-zinc-700 hover:border-zinc-600 focus:border-indigo-500/60 focus:outline-none text-zinc-100 placeholder-zinc-600 rounded-xl px-4 py-3 text-sm transition-colors">
        </div>
        <div>
          <label class="text-zinc-400 text-xs font-semibold uppercase tracking-wider block mb-2">Password</label>
          <input
            name="password"
            [(ngModel)]="user.password"
            type="password"
            placeholder="Choose a password"
            required
            autocomplete="new-password"
            class="w-full bg-zinc-800 border border-zinc-700 hover:border-zinc-600 focus:border-indigo-500/60 focus:outline-none text-zinc-100 placeholder-zinc-600 rounded-xl px-4 py-3 text-sm transition-colors">
        </div>
        <div>
          <label class="text-zinc-400 text-xs font-semibold uppercase tracking-wider block mb-2">Role</label>
          <select
            name="role"
            [(ngModel)]="user.role"
            required
            class="w-full bg-zinc-800 border border-zinc-700 hover:border-zinc-600 focus:border-indigo-500/60 focus:outline-none text-zinc-100 rounded-xl px-4 py-3 text-sm transition-colors appearance-none cursor-pointer">
            <option value="STUDENT">Student</option>
            <option value="TEACHER">Teacher</option>
          </select>
        </div>
        <button
          type="submit"
          [disabled]="registerForm.invalid"
          class="w-full bg-indigo-500 hover:bg-indigo-400 disabled:opacity-40 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-xl transition-colors text-sm mt-2">
          Create account
        </button>
      </form>
    </div>

    <p class="text-zinc-500 text-sm text-center mt-6">
      Already have an account?&nbsp;
      <a routerLink="/login" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors">Sign in</a>
    </p>
  </div>
</div>
